name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  host:
    name: host (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude cyber-sandbox-gateway --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude cyber-sandbox-gateway

  gateway:
    name: gateway (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p cyber-sandbox-gateway --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p cyber-sandbox-gateway

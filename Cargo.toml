[workspace]
resolver = "3"
members = [
  "crates/cyber-sandbox",
  "crates/cyber-sandbox-agents",
  "crates/cyber-sandbox-audit",
  "crates/cyber-sandbox-gateway",
  "crates/cyber-sandbox-image",
  "crates/cyber-sandbox-runtime",
]
# The gateway only builds for Linux; it is compiled inside the sandbox image.
default-members = [
  "crates/cyber-sandbox",
  "crates/cyber-sandbox-agents",
  "crates/cyber-sandbox-audit",
  "crates/cyber-sandbox-image",
  "crates/cyber-sandbox-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lexoliu/cyber-sandbox"
authors = ["Lexo Liu <me@lexo.cool>"]
rust-version = "1.90"

[workspace.dependencies]
cyber-sandbox-runtime = { path = "crates/cyber-sandbox-runtime", version = "0.1.0" }
cyber-sandbox-image = { path = "crates/cyber-sandbox-image", version = "0.1.0" }
cyber-sandbox-audit = { path = "crates/cyber-sandbox-audit", version = "0.1.0" }
cyber-sandbox-agents = { path = "crates/cyber-sandbox-agents", version = "0.1.0" }
cyber-sandbox-gateway = { path = "crates/cyber-sandbox-gateway", version = "0.1.0" }

anyhow = "1.0"
askama = "0.16"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "net", "time", "signal"] }
etherparse = "0.19"
hickory-proto = "0.26"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = { version = "0.2", features = ["serde"] }
netlink-packet-core = "0.9"
netlink-packet-netfilter = "0.4"
netlink-sys = { version = "0.9", features = ["tokio_socket"] }
nix = { version = "0.30", features = ["net", "socket"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
sha2 = "0.10"
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "getrandom", "rand_core", "std"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
toml = "0.9"
webpki-roots = "1"
toml_edit = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
